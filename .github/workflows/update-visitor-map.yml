name: Update visitor map

on:
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: "504283731"
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GA4 configuration
        run: |
          if [ -z "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            echo "GA4_SERVICE_ACCOUNT_JSON secret is not configured."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install map updater dependencies
        run: pip install google-analytics-data geonamescache

      - name: Generate visitor map data
        run: python bin/update_visitor_map.py

      - name: Commit updated map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visitor-map.json
          if git diff --cached --quiet; then
            echo "Visitor map data has not changed."
          else
            git commit -m "Update visitor map"
            git push
            gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
